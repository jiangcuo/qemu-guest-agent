name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the installers
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release:
        type: boolean
        default: false

permissions:
  contents: write

env:
  WIX_VERSION: 5.0.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            msystem: UCRT64
            wixarch: x64
            extra: ''
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            wixarch: arm64
            # for windmc, which LLVM does not provide
            extra: mingw-w64-ucrt-x86_64-binutils
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make bison flex diffutils ${{ matrix.extra }}
          pacboy: >-
            toolchain:p
            glib2:p
            ninja:p
            pkgconf:p
            python:p
            python-pip:p
            tools-git:p

      - id: version
        run: |
          . ./VERSION
          echo "version=$QEMU_VERSION-$PKG_RELEASE" >> "$GITHUB_OUTPUT"
          echo "qemu=$QEMU_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build qemu-ga
        run: scripts/build.sh

      - name: Build MSI
        shell: pwsh
        env:
          QEMU_VERSION: ${{ steps.version.outputs.qemu }}
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          $wixArgs = @(
            'build', 'installer/qemu-ga.wxs',
            '-arch', '${{ matrix.wixarch }}',
            '-d', "Version=$env:QEMU_VERSION",
            '-d', "StageDir=$PWD\stage",
            '-wx',
            '-o', 'out/qemu-ga-${{ matrix.arch }}.msi'
          )
          if (Test-Path stage/lib/qga-vss.dll) {
            $wixArgs += @('-d', 'InstallVss=1')
          } else {
            Write-Output "::warning::building without VSS provider"
          }
          wix @wixArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path stage/* -DestinationPath out/qemu-ga-${{ matrix.arch }}.zip

      - name: Test MSI
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Start-Process -Wait also waits for the msiexec server process, which lingers
          function Invoke-Msiexec($arguments, $log) {
            $log = Join-Path $PWD $log
            $p = Start-Process msiexec.exe -PassThru -ArgumentList "$arguments /qn /l*v `"$log`""
            if (-not $p.WaitForExit(300000)) {
              Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
              Get-Service QEMU-GA -ErrorAction SilentlyContinue | Format-List Name, Status
              throw "msiexec $arguments did not finish"
            }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80 }
            return $p.ExitCode
          }
          $msi = Resolve-Path out/qemu-ga-${{ matrix.arch }}.msi
          $rc = Invoke-Msiexec "/i `"$msi`"" install.log
          if ($rc -ne 0) { exit $rc }
          Get-Service QEMU-GA | Format-List Name, Status, StartType
          & "$env:ProgramFiles\Qemu-ga\qemu-ga.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:ProgramFiles\Qemu-ga" | Format-Table Name, Length
          $rc = Invoke-Msiexec "/x `"$msi`"" uninstall.log
          if ($rc -ne 0) { exit $rc }
          if (Get-Service QEMU-GA -ErrorAction SilentlyContinue) { throw "service still installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-ga-${{ matrix.arch }}
          path: out/*

  release:
    needs: build
    if: >-
      inputs.release ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
          pattern: qemu-ga-*

      - if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: qemu-ga ${{ needs.build.outputs.version }}
          target_commitish: ${{ inputs.ref || github.sha }}
          files: out/*
